[project]
name = "local-library"
version = "0.1.0"
description = "Personal knowledge management system with PDF ingestion and RAG capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "strophios"}
]
dependencies = [
    "jsonschema>=4.20.0",
    "langchain-text-splitters>=0.3.0",
    "litellm>=1.0.0",
    "marker-pdf==1.8.0",  # Pinned: v1.9.0+ has broken MPS acceleration (20x slowdown on Apple Silicon)
    "nameparser>=1.1.0",
    "platformdirs>=4.0.0",
    "rich>=13.0.0",
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.6",
    "typer>=0.21.0",
    "unidecode>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pymupdf>=1.25.0",
    "pypandoc-binary>=1.14",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "rapidfuzz>=3.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
local-library = "local_library.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_library"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (substeps)",
    "stage: Full pipeline stage tests",
    "contract: Transition/contract tests",
    "integration: End-to-end integration tests",
    "extraction: PDF extraction quality and accuracy tests",
    "extraction_quality: Synthetic document extraction quality benchmarks",
    "embedding: Embedding pipeline tests requiring sqlite-vec",
    "slow: Slow tests that load ML models or process large data",
]
