[project]
name = "local-library"
version = "0.1.0"
description = "Personal knowledge management system with PDF ingestion and RAG capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "strophios"}
]
dependencies = [
    "jsonschema>=4.20.0",
    "marker-pdf>=1.10.0",
    "platformdirs>=4.0.0",
    "rich>=13.0.0",
    "typer>=0.21.0",
    "unidecode>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
local-library = "local_library.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_library"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (substeps)",
    "stage: Full pipeline stage tests",
    "contract: Transition/contract tests",
    "integration: End-to-end integration tests",
]
